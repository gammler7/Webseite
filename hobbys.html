  <script>
    (function() {
      function initScrollReveal(root) {
        if (!root || typeof IntersectionObserver === 'undefined') return;
        var targets = root.querySelectorAll('h1, h2, h3, p, ul, ol, li, blockquote');
        for (var i = 0; i < targets.length; i++) {
          if (!targets[i].classList.contains('reveal-item')) {
            targets[i].classList.add('reveal-item');
          }
        }
        var observer = new IntersectionObserver(function(entries, obs) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.18 });
        for (var j = 0; j < targets.length; j++) {
          if (!targets[j].classList.contains('is-visible')) {
            observer.observe(targets[j]);
          }
        }
      }

      var el = document.getElementById('hobbys-markdown');
      initScrollReveal(el);

      fetch('hobbys.md')
        .then(function(r) { return r.text(); })
        .then(function(md) {
          if (typeof marked !== 'undefined') {
            el.innerHTML = marked.parse(md);
          } else {
            el.innerHTML = '<pre>' + md.replace(/</g, '&lt;') + '</pre>';
          }
          initScrollReveal(el);
        })
        .catch(function() { /* statischer HTML-Inhalt bleibt sichtbar */ });
    })();
  </script>
